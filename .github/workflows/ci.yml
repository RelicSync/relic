# Relic CI — builds and tests everything in the public monorepo on clean
# runners, from the public tree ONLY. That is the whole point: if this is green,
# a stranger who clones the repo can build it too.
#
# No secrets are used anywhere in this workflow, so it runs identically on fork
# pull requests. Deploys and release signing live in separate workflows that are
# restricted to `main` and tags.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  # --------------------------------------------------------------------------
  # Rust workspace: relic-core, relic-sift, relic-cli.
  # The ONNX Runtime is loaded dynamically at runtime (`sift models download`),
  # so nothing here needs model weights or a GPU.
  # --------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [workspace, relic-core, relic-sift, relic-cli]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `@stable` is a BRANCH, not a tag, so the pin is that branch's head SHA
      # and the toolchain moves to an explicit input.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-05
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.crate }}
      - name: Build
        run: |
          if [ "${{ matrix.crate }}" = "workspace" ]; then
            cargo build --workspace --locked
          else
            cargo build -p ${{ matrix.crate }} --locked
          fi
      - name: Test
        run: |
          if [ "${{ matrix.crate }}" = "workspace" ]; then
            cargo test --workspace --locked
          else
            cargo test -p ${{ matrix.crate }} --locked
          fi

  rust-fmt-clippy:
    name: rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `@stable` is a BRANCH, not a tag: pinned to that branch's head SHA.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-05
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Cloudflare Worker (powers Relic Cloud). Tests run under
  # @cloudflare/vitest-pool-workers, i.e. in a real workerd, with no account
  # and no credentials.
  # --------------------------------------------------------------------------
  worker:
    name: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # --------------------------------------------------------------------------
  # Self-host drift guard. The self-host build's entire promise is that it runs
  # the UNCHANGED worker through local adapters (SQLite + disk + a KV shim), so
  # this proves the adapters still satisfy the worker.
  #
  # The `cp selfhost/package.json package.json` step mirrors the Dockerfile:
  # dependencies must install at the REPO ROOT so that both worker/ (which
  # imports jose) and selfhost/ (which imports better-sqlite3) resolve their
  # node_modules. Installing inside selfhost/ hides jose from the sibling
  # worker/ directory and the smoke test fails on import.
  # --------------------------------------------------------------------------
  selfhost:
    name: selfhost smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install deps at the repo root (mirrors the Dockerfile)
        run: cp selfhost/package.json package.json && npm install --no-audit --no-fund
      - name: In-process smoke test (full sync data plane)
        working-directory: selfhost
        run: npm run smoke

  # --------------------------------------------------------------------------
  # Flutter client: static analysis + unit/widget tests on Linux, plus real
  # desktop builds — Windows (the primary shipping target) and Linux (the
  # in-progress port; keeping the build green from the first commit).
  # --------------------------------------------------------------------------
  flutter-analyze:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  flutter-windows:
    name: flutter build windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build (unsigned)
        run: flutter build windows --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relic-windows-unsigned
          path: app/build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error

  flutter-linux:
    name: flutter build linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux desktop build deps
        # keybinder = hotkey_manager, appindicator = tray_manager, secret =
        # flutter_secure_storage, webkit2gtk = desktop_webview_window.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libjsoncpp-dev libsecret-1-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libnotify-dev \
            libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Build
        run: flutter build linux --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relic-linux-x64
          path: app/build/linux/x64/release/bundle/
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The Apache-2.0 crypto package: pinned test vectors, byte-verified against
  # the Rust and JavaScript implementations. This is the "verify the crypto
  # yourself" claim in the README, run on every commit.
  #
  # Guarded: the crypto/ path-dependency refactor may not have landed in a given
  # checkout, and a missing directory should skip, not fail.
  # --------------------------------------------------------------------------
  crypto:
    name: crypto (dart test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for crypto/
        id: probe
        run: |
          if [ -f crypto/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crypto/ not present in this checkout — skipping dart test."
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.probe.outputs.present == 'true'
        with:
          sdk: stable
      - name: dart pub get
        if: steps.probe.outputs.present == 'true'
        working-directory: crypto
        run: dart pub get
      - name: dart test
        if: steps.probe.outputs.present == 'true'
        working-directory: crypto
        run: dart test

  # --------------------------------------------------------------------------
  # Belt and braces: the same corpus-aware secret scan that gated the carve,
  # now guarding day-to-day commits. The real protection is that secrets and
  # business docs physically live in a different repository.
  # --------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for live-secret shapes
        run: |
          if [ -x .github/scan.sh ]; then
            bash .github/scan.sh .
          else
            echo "::notice::no in-tree scanner yet; running the inline shape check."
            PAT='sk_live_[0-9A-Za-z]{16,}|rk_live_[0-9A-Za-z]{16,}|whsec_[0-9A-Za-z]{24,}'
            PAT="$PAT"'|re_[0-9A-Za-z]{24,}|sb_secret_[0-9A-Za-z_-]{16,}'
            PAT="$PAT"'|github_pat_[0-9A-Za-z_]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}'
            PAT="$PAT"'|-----BEGIN [A-Z ]*PRIVATE KEY|service_role'
            # Relic is a secret DETECTOR: its corpus, detection rules and test
            # fixtures are full of deliberately fake keys. Exclude those, plus
            # this workflow (it contains the patterns themselves) and any line
            # carrying an explicit "scan-ok" marker.
            hits="$(grep -rIEn "$PAT" . \
                 --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
                 --exclude-dir=build --exclude-dir=.dart_tool \
                 --exclude-dir=corpus --exclude-dir=holdout --exclude-dir=test \
                 --exclude=ci.yml \
                 --exclude=classify.rs --exclude=text.rs --exclude=pii.rs \
                 --exclude=tags.rs --exclude=heuristic_tags.dart \
                 --exclude=labeler.rs --exclude=pipeline.rs --exclude=sift.rs \
                 --exclude=lib.rs --exclude=README.md --exclude=install-sift.ps1 \
                 | grep -v 'scan-ok' || true)"
            if [ -n "$hits" ]; then
              echo "$hits"
              echo "::error::possible live secret above — do not merge"
              exit 1
            fi
            echo "clean"
          fi

  # --------------------------------------------------------------------------
  # Git HISTORY secret scan. The `secret-scan` job above only sees the working
  # tree, so a credential that was committed once and deleted in a later commit
  # would sail straight past it. This job walks every commit in the history.
  #
  # Deliberately a checksum-pinned BINARY rather than `gitleaks/gitleaks-action`:
  # that action requires a paid license key for organization-owned repos, and
  # public CI here uses NO SECRETS BY DESIGN so that every job runs identically
  # on fork pull requests. Nothing in this job reads a secret. Keep it that way.
  #
  # DEFAULT RULES ONLY, on purpose. The private repo's scanner carries real
  # Relic infra identifiers as tripwires; shipping a Relic-specific rule file
  # into the public tree would publish exactly the strings it is meant to
  # protect. Deliberately fake fixtures (Relic is a secret detector, its corpus
  # and its tests are full of them) are allowlisted by exact commit fingerprint
  # in the repo-root .gitleaksignore, so a NEW secret in those same files still
  # fails this job.
  # --------------------------------------------------------------------------
  history-scan:
    name: git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a shallow clone would defeat the entire point.
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the full commit history
        # --redact so a real finding never prints the secret into public logs;
        # the file, commit and rule id are enough to act on.
        run: gitleaks git --redact --no-banner .
