# Deploy the worker (Relic Cloud) from the public tree — main only, never PRs.
#
# The public repo is the canonical home of the worker source, so this is where
# deploys belong. Two repository secrets arm it; until both are set, every run
# is a loud no-op, so forks and fresh clones are unaffected:
#
#   CLOUDFLARE_API_TOKEN   API token with Workers + D1 permissions
#   WRANGLER_TOML_B64      base64 of the real wrangler.toml (resource ids are
#                          config, not code — they never live in the tree)
#
# Secrets are unavailable to fork PRs by GitHub's own rules, and the trigger is
# restricted to pushes on main and manual dispatch.
name: deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Gate on secrets
        id: gate
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_B64: ${{ secrets.WRANGLER_TOML_B64 }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$WRANGLER_B64" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy secrets not configured — skipping (this is expected on forks)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Test before deploy
        if: steps.gate.outputs.go == 'true'
        run: npm test
      - name: Materialize wrangler.toml
        if: steps.gate.outputs.go == 'true'
        env:
          WRANGLER_B64: ${{ secrets.WRANGLER_TOML_B64 }}
        run: printf '%s' "$WRANGLER_B64" | base64 -d > wrangler.toml
      - name: Apply D1 migrations
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
