# Tagged releases: build the unsigned artifacts and draft a GitHub Release.
#
# Deliberately unsigned: code signing (Azure Trusted Signing for Windows, the
# Play keystore for Android) stays on the maintainer's machine and never enters
# CI. What this workflow proves is that the tagged source builds the artifact —
# the signed installers on relic.space are produced from the same tag.
#
# No secrets are used. The draft release is only visible to maintainers until
# published.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  windows:
    name: windows build (unsigned)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "relic-${{ github.ref_name }}-windows-x64-unsigned.zip"
      - name: Draft release with artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: app/relic-${{ github.ref_name }}-windows-x64-unsigned.zip

  # Linux has no signing wall, so unlike Windows and macOS what CI builds here
  # IS the shippable artifact — the tarball and AppImage on relic.space come
  # from this same script, run against this same tag.
  linux:
    name: linux build (tarball + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libjsoncpp-dev libsecret-1-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libnotify-dev \
            libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build tarball + AppImage
        # Fetches the onnxruntime library and appimagetool itself; the sift
        # sidecar and the relic CLI are built from this checkout.
        run: bash app/scripts/build_release_linux.sh --appimage
      - name: Draft release with artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
