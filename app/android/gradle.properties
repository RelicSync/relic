org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some plugins (e.g. receive_sharing_intent) compile Java at 1.8 but Kotlin at
# 17; newer Gradle fails the build on that per-module mismatch. Downgrade the
# check to a warning — mixed-target bytecode dexes fine for Android.
kotlin.jvm.target.validation.mode=warning
# Flutter defaults compileSdk to 36 (Android 16); AGP 8.7 is older than that
# preview API, so silence its "untested compileSdk" warning rather than letting
# it fail the build.
android.suppressUnsupportedCompileSdk=36
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
